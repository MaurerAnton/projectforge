<h1>#378: <code>LanguageConverter.java</code></h1>
<div class="meta"><strong>Java converter</strong> — maps language codes to display names. Converts <code>de</code> → "Deutsch", <code>en</code> → "English", <code>ru</code> → "Русский", <code>fr</code> → "Français", <code>es</code> → "Español". Used in user profile settings and the language switcher dropdown on all pages.</div>
