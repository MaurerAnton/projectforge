<h1>#484: <code>AddressDOConverter.java</code></h1>
<div class="meta"><strong>LDAP address converter</strong> — converts <code>AddressDO</code> (ProjectForge contact) to LDAP attributes: <code>givenName</code>, <code>sn</code>, <code>mail</code>, <code>telephoneNumber</code>, <code>title</code>, <code>postalAddress</code>. Used by <code>LdapService</code> when syncing contacts to <a href="https://en.wikipedia.org/wiki/Active_Directory">Active Directory</a> or <a href="https://en.wikipedia.org/wiki/OpenLDAP">OpenLDAP</a>.</div>
